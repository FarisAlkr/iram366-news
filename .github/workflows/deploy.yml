name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual trigger from the GitHub UI

concurrency:
  # Cancel in-progress runs when a new commit lands — last commit wins.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  # GHCR requires the owner segment be lowercase. github.repository_owner
  # preserves case (FarisAlkr → fails). Hardcode lowercase here.
  IMAGE_NAME: ghcr.io/farisalkr/iram366-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # to push to GHCR

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push runner image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_CF_ANALYTICS_TOKEN=${{ secrets.NEXT_PUBLIC_CF_ANALYTICS_TOKEN }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_USERWAY_ACCOUNT_ID=${{ secrets.NEXT_PUBLIC_USERWAY_ACCOUNT_ID }}

      - name: Sync compose file + migration runner to VPS
        # The VPS needs docker-compose.yml + Caddyfile + postgres-init + the
        # SQL migration runner (`scripts/apply-migrations.sh` plus any pending
        # files under `src/payload/migrations/sql/`). Code itself lives inside
        # the image; only these orchestration / migration artifacts ride along.
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'docker-compose.yml,Caddyfile,deploy/postgres-init/*,scripts/apply-migrations.sh,src/payload/migrations/sql/*'
          target: '/opt/iram366/'
          overwrite: true

      - name: Pull new app image on VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/iram366
            docker compose pull app

      - name: Run database migrations
        # Applies any pending SQL migrations under
        # `src/payload/migrations/sql/` via `docker compose exec -T db psql`.
        # Sequencing is critical:
        #   * Runs AFTER the new image is pulled and the migration files are
        #     synced (previous SCP step), so the `sql/` directory on the VPS
        #     reflects this commit's migrations.
        #   * Runs BEFORE the app container is restarted below — if migrate
        #     exits non-zero, `set -e` fails the SSH script, the workflow
        #     aborts, and the previous app version stays up serving traffic.
        # The script wraps each migration in BEGIN/COMMIT under
        # --single-transaction + ON_ERROR_STOP=1, so a failure leaves the
        # database untouched (no half-applied migration, no spurious tracking
        # row).
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/iram366
            # scp-action preserves the executable bit, but defensive chmod
            # in case future SCP-tool changes don't.
            chmod +x scripts/apply-migrations.sh
            ./scripts/apply-migrations.sh

      - name: Restart app & reload Caddy on VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/iram366
            docker compose up -d --no-deps app
            # Ensure autoheal exists (no-op if already running)
            docker compose up -d --no-deps autoheal
            # Recreate the Caddy container so it picks up Caddyfile changes.
            #
            # The previous version of this step was `docker compose kill -s
            # SIGUSR1 caddy` — which is the canonical Caddy reload signal and
            # works correctly *if* the container can see the new file. It
            # couldn't: Docker bind-mounts the Caddyfile by file PATH, which
            # pins to the host inode at mount time. `scp` in the prior step
            # writes the replacement file as a new inode; the container's
            # mount keeps pointing at the old, now-orphaned inode. SIGUSR1
            # reloads stale content and the deploy reports success.
            #
            # PR #41 (UserWay CSP entries) was the first deploy where a
            # CSP change actually mattered to a user-visible feature — the
            # widget JS was outright blocked rather than redundantly covered
            # by the broad `https:` wildcard. The deploy "succeeded" but the
            # new CSP never went live; manual `--force-recreate caddy` fixed
            # it. Documented in docs/infrastructure-contracts.md §3 as a
            # known failure mode.
            #
            # --force-recreate is ~1–2s slower than SIGUSR1 but re-establishes
            # the bind mount against the new inode. Caddy's startup re-issues
            # the existing certs from /data, so TLS continuity is preserved.
            docker compose up -d --no-deps --force-recreate caddy
            # Show health for the run log
            sleep 6
            docker compose ps
            # Cleanup older images (keep last 3)
            docker image prune -f --filter "label=org.opencontainers.image.source=https://github.com/${{ github.repository }}" || true

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://iram366news.com --max-time 15 || echo 000)
            echo "attempt $i → HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 6
          done
          echo "site did not return 200 within 30s after deploy"
          exit 1
