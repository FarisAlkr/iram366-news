name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual trigger from the GitHub UI

concurrency:
  # Cancel in-progress runs when a new commit lands — last commit wins.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  # GHCR requires the owner segment be lowercase. github.repository_owner
  # preserves case (FarisAlkr → fails). Hardcode lowercase here.
  IMAGE_NAME: ghcr.io/farisalkr/iram366-app
  # Migrator image: ships the Payload CLI for one-shot `payload migrate`
  # runs from inside docker-compose. Built from the `migrator` stage of
  # the same Dockerfile. See Dockerfile + docker-compose.yml migrator
  # service.
  MIGRATOR_IMAGE: ghcr.io/farisalkr/iram366-migrator

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # to push to GHCR

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Explicit target since the Dockerfile now has multiple final-eligible
          # stages (migrator and runner). Without this, docker would build the
          # last stage in the file by default.
          target: runner
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_CF_ANALYTICS_TOKEN=${{ secrets.NEXT_PUBLIC_CF_ANALYTICS_TOKEN }}

      - name: Build & push migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: migrator
          push: true
          tags: |
            ${{ env.MIGRATOR_IMAGE }}:latest
            ${{ env.MIGRATOR_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync compose file to VPS
        # The VPS only needs docker-compose.yml + Caddyfile + the deploy/
        # postgres-init scripts. Code lives inside the image now.
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'docker-compose.yml,Caddyfile,deploy/postgres-init/*'
          target: '/opt/iram366/'
          overwrite: true

      - name: Pull new images on VPS
        # Pulls both the runner and the migrator. The migrator image is
        # *not* invoked by this workflow — schema migrations are run
        # manually before merging a PR that introduces a new migration
        # file (see README "Schema migrations"). It's still pulled here so
        # the operator can `docker compose --profile migrate run --rm
        # migrator npm run migrate` without an extra pull step.
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/iram366
            # --profile migrate makes the migrator service visible to compose;
            # without it `compose pull migrator` reports "no such service".
            docker compose --profile migrate pull app migrator

      - name: Restart app & reload Caddy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/iram366
            docker compose up -d --no-deps app
            # Ensure autoheal exists (no-op if already running)
            docker compose up -d --no-deps autoheal
            # Reload Caddy if its config changed. The Caddyfile is bind-mounted
            # read-only into the container, so the freshly-SCP'd file is already
            # visible on the container's filesystem — but caddy doesn't watch
            # for changes; it needs an explicit reload. SIGUSR1 makes caddy
            # gracefully re-parse the file; if the new config is invalid, caddy
            # keeps the previous one and the signal is a no-op.
            docker compose kill -s SIGUSR1 caddy || true
            # Show health for the run log
            sleep 6
            docker compose ps
            # Cleanup older images (keep last 3)
            docker image prune -f --filter "label=org.opencontainers.image.source=https://github.com/${{ github.repository }}" || true

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://iram366news.com --max-time 15 || echo 000)
            echo "attempt $i → HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 6
          done
          echo "site did not return 200 within 30s after deploy"
          exit 1
