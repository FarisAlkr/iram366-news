services:
  db:
    # pgvector/pgvector:pg16 = the official Postgres 16 image + the
    # pgvector extension pre-installed. Required for the chatbot's
    # vector-similarity search. Data volume from postgres:16-alpine
    # is fully compatible (same major version, same on-disk format).
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    # No `:-postgres` fallbacks: missing env on a fresh VPS used to silently
    # bring the stack up with `postgres:postgres` superuser creds. Fail
    # loudly instead — Compose refuses to start when a required value is
    # undeclared, surfacing the misconfig before it can ship.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # 1 vCPU / 3.8 GiB VPS. Memory ceilings keep one service's spike from
    # OOM-killing another (the kernel picks the biggest victim, which on
    # this stack is usually `db`). pgvector indexing peaks around 800 MB
    # under real load; 1 GiB leaves a comfortable buffer.
    mem_limit: 1g
    mem_reservation: 256m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  app:
    # Prebuilt image from GitHub Container Registry. Built and pushed by
    # .github/workflows/deploy.yml on every push to main. The VPS just
    # `docker compose pull`s it — no local build, no resource crunch.
    #
    # The legacy `deploy/deploy.sh` workflow (which rsyncs source and
    # `--build`s on the VPS) still works as an emergency fallback by
    # uncommenting the `build:` block below.
    image: ghcr.io/farisalkr/iram366-app:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   args:
    #     NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    #     NEXT_PUBLIC_CF_ANALYTICS_TOKEN: ${NEXT_PUBLIC_CF_ANALYTICS_TOKEN}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      PAYLOAD_PREVIEW_SECRET: ${PAYLOAD_PREVIEW_SECRET}
      R2_BUCKET: ${R2_BUCKET}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_CF_ANALYTICS_TOKEN: ${NEXT_PUBLIC_CF_ANALYTICS_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SEED_SECRET: ${SEED_SECRET:-}
      # Chatbot — see deploy/CHATBOT-SETUP.md
      NEXT_PUBLIC_CHATBOT_ENABLED: ${NEXT_PUBLIC_CHATBOT_ENABLED:-false}
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-openai}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      # Cloudflare Analytics API (Stats page Section B — pending setup)
      CF_ANALYTICS_API_TOKEN: ${CF_ANALYTICS_API_TOKEN:-}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-}
      # Push notifications (Web Push) — see .env.example. The public key is
      # inlined at BUILD time (Rule 1) but forwarded here too so the send path
      # has a server-side copy; the private key + subject are server-only.
      NEXT_PUBLIC_PUSH_ENABLED: ${NEXT_PUBLIC_PUSH_ENABLED:-false}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Sentry — DSN unset means SDK is a no-op (see docs/sentry-setup.md)
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      # UserWay accessibility widget — account ID unset means the in-footer
      # button degrades to a plain link to /accessibility-statement.
      # Forwarded here even though Next.js inlines the value at BUILD time
      # (Rule 1) — defensive runtime coverage so a future server-side reader
      # of this var also sees it, and to keep the compose file an honest
      # inventory of every env the app consumes.
      NEXT_PUBLIC_USERWAY_ACCOUNT_ID: ${NEXT_PUBLIC_USERWAY_ACCOUNT_ID:-}
    expose:
      - '3000'
    healthcheck:
      # /api/health is a DB-free liveness probe. Using /api/users (which
      # hits Postgres) caused the healthcheck to hang along with the rest
      # of the app when the pool was exhausted — see deploy/RUNBOOK.md.
      # /api/ready (DB+R2 readiness) exists separately; deliberately NOT
      # wired here so a transient DB blip doesn't autoheal-restart the
      # app under traffic.
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      # 90s gives Payload + Next a comfortable cold-boot window on the
      # 1-vCPU box. The previous 60s tripped autoheal during legitimate
      # post-deploy warmups under bursty traffic.
      start_period: 90s
    # 1 vCPU, 3.8 GiB total. Next + Payload can peak at ~1.5 GiB during
    # ISR rebuilds + Sharp image processing; 2 GiB ceiling leaves room.
    # mem_reservation = soft floor for the scheduler to keep memory
    # available; mem_limit = hard cap. Together they bound an app OOM
    # to "just app restarts" instead of "db dies too".
    mem_limit: 2g
    mem_reservation: 512m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-iramnews366@gmail.com}
    # Caddy's admin API on :2019 returns 200 when the loaded config is
    # parseable and the proxy is up. Without this healthcheck autoheal
    # ignored Caddy entirely — silent failure on the only public entry
    # point. wget is in the alpine base.
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:2019/config/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 128m
    mem_reservation: 32m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  autoheal:
    # Watches every container with a Docker healthcheck and automatically
    # restarts any that go "unhealthy". Without this, an unhealthy app
    # stays broken until a human notices — the May 2026 outage is the
    # case study. AUTOHEAL_CONTAINER_LABEL=all = watch every container.
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
      AUTOHEAL_INTERVAL: 30
      AUTOHEAL_START_PERIOD: 60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 64m
    mem_reservation: 16m
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '2'

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
